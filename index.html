<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rock Rumble</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #05060f; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8ecff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: crosshair; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 4px #000; }
  #score { top: max(12px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); font: 800 28px/1.05 ui-monospace, "Cascadia Mono", Menlo, monospace; letter-spacing: .04em; }
  #score small { display: flex; gap: 6px; margin-top: 6px; font: 700 12px system-ui, sans-serif; opacity: .8; align-items: center; }
  #score i { width: 12px; height: 14px; background: currentColor; clip-path: polygon(50% 0, 100% 100%, 50% 78%, 0 100%); }
  #top { top: max(12px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); width: 170px; font-size: 13px; }
  #top div { display: flex; align-items: center; gap: 8px; } #top i { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 6px currentColor; }
  #top span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; } #top b { font-variant-numeric: tabular-nums; } #top .me { color: #ffe066; font-weight: 800; }
  #feed { top: calc(max(12px, env(safe-area-inset-top)) + 110px); right: max(14px, env(safe-area-inset-right)); font-size: 12px; font-weight: 700; text-align: right; }
  #feed div { margin-top: 3px; }
  #msg { top: 34%; left: 0; right: 0; text-align: center; font: 800 30px system-ui, sans-serif; }
  #msg small { display: block; font-size: 15px; font-weight: 600; opacity: .8; }
  #hint { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 26px); left: 0; right: 0; padding: 0 16px; text-align: center; font-size: 14px; font-weight: 600; opacity: .9; transition: opacity .8s; }
  #net { bottom: max(10px, env(safe-area-inset-bottom)); left: max(14px, env(safe-area-inset-left)); font-size: 12px; opacity: .65; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #05060fb0; }
  #over[hidden], .stick[hidden], #fire[hidden] { display: none; }
  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 84vh; overflow: auto; padding: 22px; border-radius: 16px; background: #10142a; border: 1px solid #ffffff26; text-align: center; box-shadow: 0 0 40px #5be7ff22; }
  .card h2 { margin: 0 0 4px; font-size: 26px; letter-spacing: .04em; }
  .card h3 { margin: 16px 0 4px; font-size: 12px; color: #5be7ff; text-transform: uppercase; letter-spacing: .08em; text-align: left; }
  .card ol { text-align: left; margin: 0 0 16px; padding-left: 26px; font-size: 14px; min-height: 40px; }
  .card li span { float: right; font-variant-numeric: tabular-nums; }
  button.go { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #5be7ff; color: #041018; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  .stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid #ffffff44; background: #ffffff10; pointer-events: none; }
  .stick i { position: absolute; left: 34px; top: 34px; width: 52px; height: 52px; border-radius: 50%; background: #ffffff55; }
  #fire { position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px)); width: 92px; height: 92px; border-radius: 50%;
          border: 2px solid #ff6b8b88; background: #ff6b8b22; color: #fff; font: 800 15px system-ui, sans-serif; touch-action: none; }
  #fire.on { background: #ff6b8b66; }
  .touch #hint { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 140px); }
  @media (max-width: 640px) { #top { width: 128px; font-size: 12px; } #score { font-size: 22px; } }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="score"></div>
<div class="hud" id="top"></div>
<div class="hud" id="feed"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="net">Connecting…</div>
<div class="stick" id="stick" hidden><i></i></div>
<button id="fire" hidden>FIRE</button>
<div id="over" hidden>
  <div class="card">
    <h2>Game over</h2>
    <div id="overScore"></div>
    <h3>High scores, all time</h3>
    <ol id="board"><li>Loading the leaderboard…</li></ol>
    <button class="go" id="again">Play again</button>
  </div>
</div>
<script>
/* ═══ ROCK RUMBLE · a Multiplayer Agent starter ═══════════════════════════════════════
 * Asteroids, everyone at once: blast rocks and each other. Drop-in, 2–12 players; bots
 * fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ every number worth tuning: field, ship handling, rocks, scores, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   FIELD ......... the wraparound field: wrapped distances, safe spawn spots
 *   SHIPS ......... thrust, turn, drag and firing (shared by players and bots)
 *   BULLETS ....... bullets every screen flies, and who decides a hit
 *   ROCKS (HOST) .. rocks drifting, splitting and coming in. Only the host writes them.
 *   BOTS (HOST) ... the bot ships and their brain
 *   ME ............ flying, shooting, crashing, lives and score. Each player writes its own.
 *   OTHERS ........ everyone else's ships and the rocks, eased between snapshots
 *   DRAW .......... camera, stars, rocks, ships, bullets, effects, radar
 *   HUD & OVER .... score, lives, top 5, feed, game-over card, leaderboard, sound
 *   INPUT ......... keys, mouse, a thumb stick and a FIRE button on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `s` (one packed JSON field: position, velocity,
 *     heading, thrusting, dead, shield, score, lives) about 12 times a second, `hb` (heartbeat)
 *     once a second, and `n`/`c` (name, color) once. Score and lives are your own.
 *   - Shots are events: "shot" {x, y, vx, vy}. Every screen flies every bullet the same way.
 *   - A HIT ON A SHIP IS THE VICTIM'S OWN FACT: only you check bullets and rocks against your
 *     ship. When you go down you send "down" {v: you, by: shooter or "", why}; a shooter adds
 *     the points. Crashing into a rock also sends "ram" {id, x, y} so the host breaks that rock.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `rocks` ([id, size, x, y,
 *     vx, vy] each; others carry them forward along their velocity) and `bots`. The host
 *     decides which bullets break rocks and sends "pts" {to, n} to the player who broke one.
 *     A new host adopts both fields and carries on.
 *   - Bot shots go out batched, 10 times a second: "shots" {list: [[bot, x, y, vx, vy]…]}.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "high-score": each player's best score in one run (three ships).
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  w: 2400, h: 1600,     // the field (it wraps around at every edge)
  seats: 6,             // bots fill the field up to this many ships
  lives: 3,             // ships per run; lose them all and the run is over
  rockLoad: 24,         // how full the host keeps the field: a big rock counts 3, a medium 2, a small 1 (a big one comes in when it's low)
  maxRocks: 56,         // never more than this many (they share one field)
  turn: 4.4,            // rad/s
  thrust: 460,          // px/s² while thrusting
  maxSpeed: 500,        // px/s
  drag: 0.55,           // how fast a coasting ship slows down (per second)
  fireEvery: 0.2,       // seconds between shots
  bulletSpeed: 720,     // px/s on top of the ship's own speed
  bulletLife: 1.05,     // seconds before a bullet fizzles
  respawnMs: 2000,      // ms before your next ship
  shieldMs: 2500,       // ms nothing can hurt a fresh ship
  rockSpeed: [35, 95],  // px/s for a big rock (smaller ones fly faster)
  points: [0, 100, 50, 20], // score for breaking a small (1), medium (2) or big (3) rock
  shipPoints: 200,      // score for downing a ship
  botAim: 0.1,          // radians a bot's aim wanders
  botFireEvery: 0.38,   // seconds between a bot's shots
  graceMs: 6000,        // ms after a ship appears before bots will hunt it
  botRange: 650,        // px: bots pick fights this close
  botAggr: [0.25, 0.7], // how keen each bot is to hunt ships instead of rocks (0..1)
  board: "high-score",  // leaderboard name
};
const ROCK_R = [0, 15, 30, 54]; // rock radius by size
const SHIP_R = 13;
const BOT_NAMES = ["Comet", "Nova", "Orbit", "Quasar", "Zenith", "Pulsar", "Nebula", "Ion", "Vega", "Rigel"];
const COLORS = ["#5be7ff", "#ff6b8b", "#ffe066", "#7dff8a", "#c77dff", "#ff9f43", "#4d96ff", "#f15bb5", "#9ef01a", "#ffffff"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'rock-rumble',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, { w: 950, h: 600, seats: 7, rockLoad: 17, respawnMs: 900, shieldMs: 500, botAggr: [0.5, 0.9], botFireEvery: 0.24, botRange: 800 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;

// ── FIELD ───────────────────────────────────────────────────────────────────────────
const FW = CONFIG.w, FH = CONFIG.h;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const wrap = (v, size) => ((v % size) + size) % size;
const wd = (d, size) => d - size * Math.round(d / size); // the shortest way across the wrap
const dx = (a, b) => wd(b.x - a.x, FW), dy = (a, b) => wd(b.y - a.y, FH);
const dist = (a, b) => Math.hypot(dx(a, b), dy(a, b));
/** The spot farthest from every rock and ship (a few random tries). */
function safeSpot() {
  let best = { x: rnd(0, FW), y: rnd(0, FH) }, bd = -1;
  const rocks = rockList(), ships = allShips().filter((s) => !s.dead);
  for (let i = 0; i < 16; i++) {
    const p = { x: rnd(0, FW), y: rnd(0, FH) };
    let d = 9999;
    for (const r of rocks) d = Math.min(d, dist(p, r) - ROCK_R[r.s] * 2);
    for (const s of ships) d = Math.min(d, dist(p, s) * 0.6);
    if (d > bd) { bd = d; best = p; }
  }
  return best;
}

// ── SHIPS ───────────────────────────────────────────────────────────────────────────
// A ship (me or a bot): { id, name, color, x, y, vx, vy, a (heading), t (thrusting), dead, shieldUntil, cd, score }.
function newShip(id, name, color) { return { id, name, color, x: FW / 2, y: FH / 2, vx: 0, vy: 0, a: -Math.PI / 2, t: 0, dead: 0, shieldUntil: 0, cd: 0, score: 0, firedAt: -1e9 }; }
/** Turn (-1..1), thrust (-0.5..1), drag, speed limit, wrap. */
function flyShip(s, dt, turn, thrust) {
  s.a += Math.max(-1, Math.min(1, turn)) * CONFIG.turn * dt;
  s.t = thrust > 0 ? 1 : 0;
  s.vx += Math.cos(s.a) * CONFIG.thrust * thrust * dt; s.vy += Math.sin(s.a) * CONFIG.thrust * thrust * dt;
  const k = Math.exp(-CONFIG.drag * dt), sp = Math.hypot(s.vx, s.vy), cap = sp > CONFIG.maxSpeed ? CONFIG.maxSpeed / sp : 1;
  s.vx *= k * cap; s.vy *= k * cap;
  s.x = wrap(s.x + s.vx * dt, FW); s.y = wrap(s.y + s.vy * dt, FH);
}
/** How hard to turn to face angle `want` this frame (-1..1). */
const turnToward = (s, want, dt) => Math.atan2(Math.sin(want - s.a), Math.cos(want - s.a)) / (CONFIG.turn * dt);
/** A bullet from the nose: [x, y, vx, vy] (it carries the ship's own speed). */
function noseShot(s) {
  s.firedAt = performance.now();
  return [Math.round(wrap(s.x + Math.cos(s.a) * 18, FW)), Math.round(wrap(s.y + Math.sin(s.a) * 18, FH)), Math.round(s.vx + Math.cos(s.a) * CONFIG.bulletSpeed), Math.round(s.vy + Math.sin(s.a) * CONFIG.bulletSpeed)];
}

// ── BULLETS ─────────────────────────────────────────────────────────────────────────
const bullets = [];
function addBullet(owner, x, y, vx, vy) {
  const s = shipById(owner);
  bullets.push({ owner, x, y, vx, vy, life: CONFIG.bulletLife, color: s ? s.color : "#fff" });
  const v = views.get(owner); if (v) v.firedAt = performance.now();
}
/** Move every bullet (two half-steps). Rocks and ships stop them; the one hit (or the host, for rocks and bots) decides. */
function stepBullets(dt) {
  const rocks = rockList(), ships = allShips().filter((s) => !s.dead), now = Date.now();
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    let gone = (b.life -= dt) <= 0;
    for (let k = 0; k < 2 && !gone; k++) {
      b.x = wrap(b.x + b.vx * dt / 2, FW); b.y = wrap(b.y + b.vy * dt / 2, FH);
      for (const r of rocks) {
        if (gone || Math.abs(dx(b, r)) > ROCK_R[r.s] + 3 || dist(b, r) > ROCK_R[r.s] + 3) continue;
        gone = true; sparks(b.x, b.y, "#cfd8ff", 6, 160);
        if (world.acting) breakRock(r, b.owner, b.vx, b.vy);
      }
      for (const s of ships) {
        if (gone || s.id === b.owner || dist(b, s) > SHIP_R + 3) continue;
        gone = true; sparks(b.x, b.y, s.color, 6, 160);
        if (now < (s.shieldUntil || 0) || s.sh) continue;
        if (s === me) crash("shot", b.owner);                    // me: my own fact
        else if (s.bot && world.acting) botDown(s, "shot", b.owner); // a bot: the host decides
      }
    }
    if (gone) bullets.splice(i, 1);
  }
}

// ── ROCKS (HOST) ────────────────────────────────────────────────────────────────────
const world = { acting: false, rocks: new Map(), nextId: 1, bots: new Map(), dirty: false, lastRocks: 0, lastBots: 0, lastSpawn: 0, shots: [] };
/** Become host: take over the rocks and bots. Where this screen has been carrying them forward (the old
 *  host may have gone quiet up to 3s ago), start from there, not from its last write: no jump back. */
function adoptWorld() {
  world.acting = true; world.rocks.clear(); world.bots.clear();
  for (const [id, s, x, y, vx, vy] of parseOnce("rocks", S.shared.rocks, [])) {
    const v = rockViews.get(id);
    if (ROCK_R[s]) world.rocks.set(id, v ? { id, s, x: v.x, y: v.y, vx, vy } : { id, s, x, y, vx, vy });
  }
  world.nextId = Math.max(0, ...world.rocks.keys()) + 1;
  for (const b of parseOnce("bots", S.shared.bots, [])) {
    const v = views.get(b.i);
    const s = Object.assign(newShip(b.i, b.n, b.c), { x: v ? v.x : b.x, y: v ? v.y : b.y, vx: b.vx, vy: b.vy, a: v ? v.a : b.a, dead: b.d, score: b.sc || 0, bot: true, respawnAt: Date.now() + 1000 });
    brainFor(s); world.bots.set(s.id, s);
  }
  world.dirty = true;
}
/** A big rock comes in far from every ship, drifting across the field. */
function spawnRock(size = 3) {
  const at = safeSpot(), a = rnd(0, Math.PI * 2), sp = rnd(...CONFIG.rockSpeed);
  const id = world.nextId++;
  world.rocks.set(id, { id, s: size, x: at.x, y: at.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp });
  world.dirty = true;
}
/** A bullet (or a ship) hit a rock on the host's screen: it splits in two smaller ones, and the shooter scores. */
function breakRock(r, by, ivx = 0, ivy = 0) {
  if (!world.rocks.has(r.id)) return;
  world.rocks.delete(r.id); world.dirty = true;
  rockBurst(r);
  if (r.s > 1 && world.rocks.size < CONFIG.maxRocks - 1) {
    const sp = Math.hypot(r.vx, r.vy) * rnd(1.3, 1.7) + 30, base = Math.atan2(r.vy + ivy * 0.04, r.vx + ivx * 0.04);
    for (const side of [-1, 1]) {
      const a = base + side * rnd(0.4, 0.9), id = world.nextId++;
      world.rocks.set(id, { id, s: r.s - 1, x: wrap(r.x + Math.cos(a) * ROCK_R[r.s - 1], FW), y: wrap(r.y + Math.sin(a) * ROCK_R[r.s - 1], FH), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp });
    }
  }
  if (!by) return;
  const n = CONFIG.points[r.s], bot = world.bots.get(by);
  if (by === me.id) score(n, r.x, r.y);
  else if (bot) bot.score += n;
  else net.send("pts", { to: by, n, x: Math.round(r.x), y: Math.round(r.y) });
}

// ── BOTS (HOST) ─────────────────────────────────────────────────────────────────────
// Each bot has a temper: it shoots rocks for points, hunts ships it can catch, and steers clear of rocks about to hit it.
function brainFor(b) { Object.assign(b, { aggr: rnd(...CONFIG.botAggr), target: null, thinkAt: 0, seed: Math.random() * 9 }); }
function newBot() {
  const names = new Set(allShips().map((s) => s.name)), used = new Set(allShips().map((s) => s.color)), id = "b" + Math.random().toString(36).slice(2, 6);
  const b = Object.assign(newShip(id, BOT_NAMES.find((n) => !names.has(n)) || "Bot", COLORS.find((c) => !used.has(c)) || pick(COLORS)), { bot: true });
  brainFor(b); placeShip(b);
  return b;
}
function placeShip(s) { const at = safeSpot(); Object.assign(s, { x: at.x, y: at.y, vx: 0, vy: 0, a: rnd(0, Math.PI * 2), dead: 0, shieldUntil: Date.now() + CONFIG.shieldMs, cd: 0.5, bornAt: performance.now() }); }
/** Bots fill the field up to CONFIG.seats; one leaves when a person joins. A bot never wears a person's color. */
function fitBots() {
  const humans = livePlayers().filter((id) => !(ATTRACT && id === me.id)).length, want = Math.max(0, CONFIG.seats - humans);
  const people = new Set(allShips().filter((s) => !s.bot).map((s) => s.color));
  for (const b of world.bots.values()) if (people.has(b.color)) { const used = new Set(allShips().map((s) => s.color)); b.color = COLORS.find((c) => !used.has(c)) || b.color; }
  if (world.bots.size > want) world.bots.delete([...world.bots.keys()].pop());
  if (world.bots.size < want && performance.now() - world.lastSpawn > 500) { world.lastSpawn = performance.now(); const b = newBot(); world.bots.set(b.id, b); }
}
/** A bot is down (the host decides for bots). */
function botDown(b, why, by) {
  if (b.dead) return;
  Object.assign(b, { dead: 1, respawnAt: Date.now() + CONFIG.respawnMs });
  const msg = { v: b.id, by: by || "", why };
  net.send("down", msg); onDown(msg);
}
/** The rock about to hit this ship in the next ~0.9s, or null. */
function incoming(s, rocks) {
  let worst = null, wt = 0.9;
  for (const r of rocks) {
    const rx = dx(s, r), ry = dy(s, r), vx = r.vx - s.vx, vy = r.vy - s.vy, v2 = vx * vx + vy * vy || 1;
    const t = -(rx * vx + ry * vy) / v2;
    if (t < 0 || t > wt) continue;
    if (Math.hypot(rx + vx * t, ry + vy * t) < ROCK_R[r.s] + SHIP_R + 26) { wt = t; worst = r; }
  }
  return worst;
}
/** One bot's brain: dodge, pick a target, lead it, shoot when lined up, thrust to keep a fighting distance. */
function stepBot(b, dt, t, ships, rocks) {
  if (b.dead) { if (t >= b.respawnAt) placeShip(b); return; }
  if (t > b.thinkAt) {
    b.thinkAt = t + 400;
    let foe = null, fd = CONFIG.botRange;
    for (const o of ships) { if (o.id === b.id || o.dead || t < (o.shieldUntil || 0) || o.sh || performance.now() - (o.bornAt ?? -1e9) < CONFIG.graceMs) continue; const d = dist(o, b); if (d < fd) { fd = d; foe = o; } }

  ctx.fillStyle = s.color + "33"; ctx.fill();
  ctx.strokeStyle = s.color; ctx.globalAlpha = 0.3; ctx.lineWidth = 8; ctx.stroke();
  ctx.globalAlpha = 1; ctx.lineWidth = 2.4; ctx.stroke();
  const v = s === me ? me : views.get(s.id) || s;
  if (now - (v.firedAt || -1e9) < 60) { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(k * 1.3, 0, 4, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  const shielded = s === me || (s.bot && world.acting) ? Date.now() < s.shieldUntil : s.sh;
  if (shielded) { ctx.strokeStyle = s.color; ctx.globalAlpha = 0.4 + 0.3 * Math.sin(now / 80); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, k * 1.9, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
  if (ATTRACT) return;
  ctx.font = "700 12px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = s === me ? "#ffe066" : s.color;
  ctx.fillText(s === me ? "You" : s.name, x, y - k * 2.2);
}
function drawRadar() {
  if (ATTRACT) return;
  const w = Math.min(130, W * 0.3), h = w * FH / FW, x0 = W - w - 14, y0 = H - h - 14 - (touchUI ? 132 : 0);
  ctx.fillStyle = "#0b0f26cc"; ctx.strokeStyle = "#5be7ff44"; ctx.lineWidth = 1; ctx.fillRect(x0, y0, w, h); ctx.strokeRect(x0, y0, w, h);
  const kx = w / FW, ky = h / FH;
  ctx.fillStyle = "#8f9bd8";
  for (const r of rockList()) { ctx.beginPath(); ctx.arc(x0 + r.x * kx, y0 + r.y * ky, Math.max(1, ROCK_R[r.s] * kx), 0, Math.PI * 2); ctx.fill(); }
  for (const s of allShips()) if (!s.dead) { ctx.fillStyle = s === me ? "#ffe066" : s.color; ctx.fillRect(x0 + s.x * kx - 2, y0 + s.y * ky - 2, 4, 4); }
}

// ── HUD & OVER ──────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const feed = [];
let board = null, netDown = false, startedAt = 0, toastUntil = 0, toastText = "";
function toast(text) { if (ATTRACT) return; toastText = text; toastUntil = performance.now() + 1500; }
function hud(now) {
  if (ATTRACT) { for (const id of ["score", "top", "feed", "msg", "hint", "net"]) $(id).textContent = ""; return; }
  $("score").innerHTML = `${String(me.score).padStart(5, "0")}<small>${"<i></i>".repeat(Math.max(0, me.lives))}</small>`;
  $("score").style.color = me.color;
  const rows = allShips().filter((s) => !s.dead || s === me).map((s) => ({ name: s === me ? "You" : s.name, color: s.color, sc: s.score, mine: s === me })).sort((a, b) => b.sc - a.sc);
  $("top").innerHTML = rows.slice(0, 5).map((r) => `<div class="${r.mine ? "me" : ""}"><i style="background:${r.color};color:${r.color}"></i><span>${esc(r.name)}</span><b>${r.sc}</b></div>`).join("");
  $("feed").innerHTML = feed.filter((f) => now - f.at < 6000).map((f) => `<div style="color:${f.color}">${esc(f.text)}</div>`).join("");
  const t = Date.now();
  $("msg").innerHTML = me.dead && !me.over ? `${me.killer ? `Downed by ${esc(me.killer)}` : "Crashed!"}<small>Next ship in ${Math.max(0, Math.ceil((me.respawnAt - t) / 1000))}</small>` : now < toastUntil ? esc(toastText) : "";
  $("hint").style.opacity = now - startedAt < 10000 ? 1 : 0;
  $("hint").textContent = touchUI ? "Thumb stick steers and thrusts · hold FIRE to shoot" : "← → or the mouse to turn · ↑ / W / right-click to thrust · Space or click to shoot";
  const n = livePlayers().length;
  $("net").textContent = netDown ? "Reconnecting…" : net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the rocks" : ""}`;
}
function showOver() {
  $("overScore").textContent = `Score ${me.score} · ${me.downs} ship${me.downs === 1 ? "" : "s"} downed`;
  $("over").hidden = false;
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading the leaderboard…</li>";
  board.submit(me.score).catch(() => null).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No scores yet. You're first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => newRun();

let audio = null; // made on the first tap or key (browsers block sound before that)
function sfx(kind) {
  if (!audio || ATTRACT) return;
  const [f0, f1, dur, vol, type] = { shot: [880, 220, 0.08, 0.03, "square"], crack: [300, 80, 0.12, 0.06, "sawtooth"], boom: [140, 40, 0.4, 0.1, "sawtooth"], kill: [440, 990, 0.3, 0.07, "triangle"] }[kind];
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
document.body.classList.toggle("touch", touchUI);
const keys = new Set(), mouse = { x: 0, y: 0, on: false, fire: false, thrust: false };
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  try { audio ||= new AudioContext(); } catch {}
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
  if (["arrowleft", "arrowright", "a", "d"].includes(k)) mouse.on = false; // keys steer: stop following the mouse
  keys.add(k);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); mouse.fire = mouse.thrust = false; });
addEventListener("contextmenu", (e) => e.preventDefault());
addEventListener("pointerdown", () => { try { audio ||= new AudioContext(); } catch {} }, { once: true });
let stick = null; // touch: a thumb stick wherever the left thumb lands; push it to steer, push it far to thrust
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (e.pointerType === "mouse") { mouse.on = true; if (e.button === 0) mouse.fire = true; if (e.button === 2) mouse.thrust = true; return; }
  if (stick) return;
  stick = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 };
  Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false;
});
addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { if (Math.hypot(e.clientX - mouse.x, e.clientY - mouse.y) > 3) mouse.on = true; mouse.x = e.clientX; mouse.y = e.clientY; return; }
  if (!stick || stick.id !== e.pointerId) return;
  let ddx = e.clientX - stick.x0, ddy = e.clientY - stick.y0; const d = Math.hypot(ddx, ddy);
  if (d > 50) { ddx *= 50 / d; ddy *= 50 / d; }
  stick.dx = ddx; stick.dy = ddy; $("stick").firstChild.style.transform = `translate(${ddx}px, ${ddy}px)`;
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => {
  if (e.pointerType === "mouse") { if (e.button === 0) mouse.fire = false; if (e.button === 2) mouse.thrust = false; return; }
  if (stick && stick.id === e.pointerId) { stick = null; $("stick").hidden = true; }
});
const fireBtn = $("fire");
fireBtn.hidden = !touchUI;
let fireHeld = false;
fireBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); fireHeld = true; fireBtn.classList.add("on"); try { audio ||= new AudioContext(); } catch {} });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) fireBtn.addEventListener(ev, () => { fireHeld = false; fireBtn.classList.remove("on"); });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
/** Keys, mouse and stick into this frame's turn, thrust and trigger. Mouse aim goes through the camera that drew the frame. */
function readInput() {
  input.turn = (keys.has("arrowright") || keys.has("d") ? 1 : 0) - (keys.has("arrowleft") || keys.has("a") ? 1 : 0);
  input.thrust = keys.has("arrowup") || keys.has("w") || mouse.thrust ? 1 : keys.has("arrowdown") || keys.has("s") ? -0.5 : 0;
  input.fire = keys.has(" ") || mouse.fire || fireHeld;
  input.aim = null;
  if (stick && Math.hypot(stick.dx, stick.dy) > 12) { input.aim = Math.atan2(stick.dy, stick.dx); input.thrust = Math.hypot(stick.dx, stick.dy) > 34 ? 1 : 0; }
  else if (mouse.on && !input.turn) input.aim = Math.atan2(wd(cam.y + (mouse.y - H / 2) / cam.z - me.y, FH), wd(cam.x + (mouse.x - W / 2) / cam.z - me.x, FW));
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (!isHost()) world.acting = false;
  syncViews(dt);
  if (isHost()) hostTick(dt, now);
  if (me.wantLaunch) { me.wantLaunch = false; newRun(); }
  if (!ATTRACT) readInput();
  myTick(dt);
  stepBullets(dt);
  draw(dt, now);
  if (now - lastHud > 150) { lastHud = now; hud(now); }
  requestAnimationFrame(frame);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("shot", (msg, from) => { if (msg && typeof msg.x === "number") addBullet(from, msg.x, msg.y, Math.max(-2000, Math.min(2000, msg.vx)), Math.max(-2000, Math.min(2000, msg.vy))); });
  net.on("shots", (msg) => { if (msg && Array.isArray(msg.list)) for (const [id, x, y, vx, vy] of msg.list.slice(0, 40)) addBullet(id, x, y, vx, vy); });
  net.on("down", (msg) => onDown(msg));
  net.on("pts", (msg) => { if (msg && msg.to === me.id) score(Math.max(0, Math.min(500, Number(msg.n) || 0)), msg.x, msg.y); });
  net.on("ram", (msg) => { const r = msg && world.acting && world.rocks.get(msg.id); if (r && dist({ x: +msg.x || 0, y: +msg.y || 0 }, r) < ROCK_R[r.s] + 120) breakRock(r, ""); }); // only a rock near where the ship went down
  net.onDisconnect(() => { netDown = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { netDown = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botColors()]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || pick(COLORS);
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  startedAt = performance.now(); me.wantLaunch = true;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
